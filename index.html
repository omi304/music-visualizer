<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        <!-- Visualization Canvas -->
        <div class="canvas-container">
            <canvas id="visualizer-canvas"></canvas>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <!-- Header -->
            <div class="panel-header">
                <h1>Music Visualizer</h1>
                <button class="btn-close" id="btn-close-panel">✕</button>
            </div>

            <!-- File Upload Section -->
            <div class="upload-section">
                <div class="upload-group">
                    <label for="audio-file" class="upload-label">
                        <span class="upload-icon">🎵</span>
                        <span>Upload Music</span>
                    </label>
                    <input type="file" id="audio-file" accept="audio/*" class="file-input">
                </div>

                <div class="upload-group">
                    <label for="image-file" class="upload-label">
                        <span class="upload-icon">🖼️</span>
                        <span>Upload Image</span>
                    </label>
                    <input type="file" id="image-file" accept="image/*" class="file-input">
                </div>
            </div>

            <!-- Now Playing -->
            <div class="now-playing">
                <div class="track-info">
                    <p id="track-name">No track loaded</p>
                    <p id="track-time">00:00 / 00:00</p>
                </div>
            </div>

            <!-- Player Controls -->
            <div class="player-controls">
                <button id="btn-play" class="control-btn">▶ Play</button>
                <button id="btn-pause" class="control-btn">⏸ Pause</button>
                <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0">
            </div>

            <!-- Volume Control -->
            <div class="control-group">
                <label for="volume-slider">Volume</label>
                <input type="range" id="volume-slider" class="slider" min="0" max="100" value="80">
                <span id="volume-value">80%</span>
            </div>

            <!-- Visualization Settings -->
            <div class="settings-section">
                <h3>Visualization Settings</h3>

                <div class="control-group">
                    <label for="sensitivity-slider">Sensitivity</label>
                    <input type="range" id="sensitivity-slider" class="slider" min="0" max="200" value="100">
                    <span id="sensitivity-value">100%</span>
                </div>

                <div class="control-group">
                    <label for="particle-count-slider">Particle Count</label>
                    <input type="range" id="particle-count-slider" class="slider" min="100" max="5000" value="2000" step="100">
                    <span id="particle-count-value">2000</span>
                </div>

                <div class="control-group">
                    <label for="speed-slider">Animation Speed</label>
                    <input type="range" id="speed-slider" class="slider" min="0.5" max="3" value="1" step="0.1">
                    <span id="speed-value">1.0x</span>
                </div>

                <div class="control-group">
                    <label for="color-preset">Color Theme</label>
                    <select id="color-preset" class="select">
                        <option value="neon">Neon (Default)</option>
                        <option value="ocean">Ocean Blue</option>
                        <option value="sunset">Sunset</option>
                        <option value="forest">Forest Green</option>
                        <option value="retro">Retro Purple</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="background-preset">Background Style</label>
                    <select id="background-preset" class="select">
                        <option value="dark">Dark</option>
                        <option value="gradient">Gradient</option>
                        <option value="image">Image Mapped</option>
                    </select>
                </div>

                <div class="toggle-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="toggle-particles" checked>
                        <span>Show Particles</span>
                    </label>
                </div>

                <div class="toggle-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="toggle-piano" checked>
                        <span>Show Piano Cascade</span>
                    </label>
                </div>

                <div class="toggle-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="toggle-spectrum" checked>
                        <span>Show Spectrum</span>
                    </label>
                </div>
            </div>

            <!-- About Section -->
            <div class="about-section">
                <p>Music Visualizer • Inspired by See Music</p>
                <p style="font-size: 12px; opacity: 0.7;">v1.0.0 • Made with ❤️</p>
            </div>
        </div>

        <!-- Mobile Menu Toggle -->
        <button class="btn-menu" id="btn-menu">☰</button>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/audio-analyzer.js"></script>
    <script src="js/visualizer.js"></script>
    <script src="js/ui-controller.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
