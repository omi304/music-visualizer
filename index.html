<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        /* Canvas Area */
        #canvas {
            flex: 1;
            display: block;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
        }

        /* Control Panel */
        .control-panel {
            width: 300px;
            background: rgba(15, 15, 40, 0.95);
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid #00ff88;
        }

        .control-panel h2 {
            margin-bottom: 20px;
            color: #00ff88;
            font-size: 18px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }

        .control-group input[type="file"],
        .control-group input[type="range"],
        .control-group button {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .control-group button {
            background: rgba(0, 255, 136, 0.2);
            transition: all 0.3s;
        }

        .control-group button:hover {
            background: rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .control-group input[type="range"] {
            padding: 5px;
        }

        .info {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }

        /* Mobile Menu */
        .btn-menu {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
            width: 40px;
            height: 40px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 20px;
            z-index: 100;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .control-panel {
                display: none;
                position: fixed;
                top: 0;
                right: 0;
                width: 100%;
                height: 100%;
                z-index: 99;
                border-left: none;
                border-top: 1px solid #00ff88;
            }

            .control-panel.active {
                display: block;
            }

            .btn-menu {
                display: block;
            }

            #canvas {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        
        <div class="control-panel">
            <h2>Music Visualizer</h2>

            <div class="control-group">
                <label>Upload Music</label>
                <input type="file" id="audio-file" accept="audio/*">
            </div>

            <div class="control-group">
                <label>Upload Image</label>
                <input type="file" id="image-file" accept="image/*">
            </div>

            <div class="control-group">
                <button id="btn-play">▶ Play</button>
                <button id="btn-pause">⏸ Pause</button>
            </div>

            <div class="control-group">
                <label>Volume</label>
                <input type="range" id="volume-slider" min="0" max="100" value="80">
            </div>

            <div class="control-group">
                <label>Sensitivity</label>
                <input type="range" id="sensitivity-slider" min="0" max="200" value="100">
            </div>

            <div class="control-group">
                <label>Speed</label>
                <input type="range" id="speed-slider" min="0.5" max="3" value="1" step="0.1">
            </div>

            <div class="info">
                <p id="track-info">No track loaded</p>
                <p style="margin-top: 10px;">Music Visualizer v1.0</p>
            </div>
        </div>
    </div>

    <button class="btn-menu" id="btn-menu">☰</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Audio Context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let analyser;
        let audioSource;
        let audioBuffer;
        let isPlaying = false;

        // Three.js Scene
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0a0e27);
        camera.position.z = 5;

        // Particles
        const particleGeometry = new THREE.BufferGeometry();
        const particleCount = 2000;
        const positions = new Float32Array(particleCount * 3);
        
        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 20;
            positions[i + 1] = (Math.random() - 0.5) * 20;
            positions[i + 2] = (Math.random() - 0.5) * 20;
        }
        
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMaterial = new THREE.PointsMaterial({
            color: 0x00ff88,
            size: 0.1,
            sizeAttenuation: true,
            transparent: true,
            opacity: 0.8
        });
        
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // Frequency Data
        let dataArray = new Uint8Array(256);

        // File Upload Handler
        document.getElementById('audio-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    audioContext.decodeAudioData(event.target.result, (buffer) => {
                        audioBuffer = buffer;
                        document.getElementById('track-info').innerText = file.name;
                        
                        // Setup analyser
                        if (!analyser) {
                            analyser = audioContext.createAnalyser();
                            analyser.fftSize = 512;
                            analyser.connect(audioContext.destination);
                        }
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // Play/Pause
        document.getElementById('btn-play').addEventListener('click', () => {
            if (audioBuffer && !isPlaying) {
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(analyser);
                source.start(0);
                isPlaying = true;
            }
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            audioContext.suspend();
            isPlaying = false;
        });

        // Volume Control
        document.getElementById('volume-slider').addEventListener('change', (e) => {
            const gain = audioContext.createGain();
            gain.gain.value = e.target.value / 100;
            if (analyser) analyser.disconnect();
            analyser.connect(gain);
            gain.connect(audioContext.destination);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                
                const avg = dataArray.reduce((a, b) => a + b) / dataArray.length;
                const scale = 1 + avg / 256;
                
                particles.scale.set(scale, scale, scale);
                particles.rotation.x += 0.0001;
                particles.rotation.y += 0.0002;
            }

            renderer.render(scene, camera);
        }

        animate();

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Mobile Menu
        document.getElementById('btn-menu').addEventListener('click', () => {
            document.querySelector('.control-panel').classList.toggle('active');
        });
    </script>
</body>
</html>
